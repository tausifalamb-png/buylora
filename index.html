
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buylora | Shop & Share</title>
<style>
:root{--green:#087f5b;--light:#e9f8f1;--dark:#16352b}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7f6;color:#18251f}
header{background:white;padding:14px 5%;display:flex;align-items:center;
justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5;
box-shadow:0 2px 10px #0000000c}
.logo{font-size:25px;font-weight:900;color:var(--green)}
button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;
font-weight:bold}
.primary{background:var(--green);color:white}
.secondary{background:var(--light);color:var(--green)}
main{max-width:1150px;margin:auto;padding:22px 16px}
.hero{background:linear-gradient(120deg,#d9f7e8,#f5fff9);
padding:28px 22px;border-radius:20px;margin-bottom:20px}
.hero h1{font-size:30px;margin:0 0 10px;color:var(--dark)}
.hero p{color:#456457;line-height:1.5}
.search{display:flex;gap:8px;margin:18px 0}
input{width:100%;min-width:0;padding:13px;border:1px solid #dce5df;
border-radius:10px;font-size:15px}
.categories{display:flex;gap:8px;overflow:auto;padding:4px 0 15px}
.categories button{white-space:nowrap;background:white;border:1px solid #e1e9e4}
.categories button.active{background:var(--green);color:white}
.section-title{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:white;border-radius:15px;overflow:hidden;
border:1px solid #e9eeeb;min-width:0}
.product-img{height:160px;background:var(--light);display:flex;
align-items:center;justify-content:center;font-size:60px}
.card-body{padding:12px}
.tag{font-size:11px;color:var(--green);font-weight:bold}
.card h3{font-size:15px;margin:8px 0}
.price{font-size:20px;font-weight:bold}
.old{font-size:12px;color:#89958e;text-decoration:line-through}
.actions{display:flex;gap:7px;margin-top:12px}
.actions button{flex:1;padding:10px 5px;font-size:12px}
.panel{background:white;padding:18px;border-radius:16px;margin-top:20px}
.hidden{display:none!important}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
background:#16352b;color:white;padding:12px 18px;border-radius:12px;
display:none;z-index:20;max-width:90%;text-align:center}
footer{text-align:center;padding:28px 12px;color:#718077}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.product-img{height:135px}.hero h1{font-size:25px}}
@media(max-width:360px){.grid{gap:8px}.card-body{padding:9px}}
</style>
</head>
<body>
<header>
  <div class="logo">🛍️ Buylora</div>
  <button class="secondary" onclick="showCart()">🛒 Cart (<span id="count">0</span>)</button>
</header>

<main>
  <section class="hero">
    <h1>Discover. Shop. Share.</h1>
    <p>Find useful products, explore details and share your favourite deals with friends.</p>
    <button class="primary" onclick="document.getElementById('catalogue').scrollIntoView({behavior:'smooth'})">Explore Products →</button>
  </section>

  <div class="search">
    <input id="search" placeholder="Search products..." oninput="renderProducts()">
  </div>

  <div class="categories" id="categories">
    <button class="active" onclick="setCategory('All',this)">All</button>
    <button onclick="setCategory('Electronics',this)">Electronics</button>
    <button onclick="setCategory('Fashion',this)">Fashion</button>
    <button onclick="setCategory('Home',this)">Home</button>
    <button onclick="setCategory('Accessories',this)">Accessories</button>
  </div>

  <section id="catalogue">
    <div class="section-title">
      <h2>Popular Products</h2>
      <span id="total"></span>
    </div>
    <div class="grid" id="products"></div>
  </section>

  <section id="detail" class="panel hidden"></section>
  <section id="cart" class="panel hidden"></section>
  <section class="panel">
    <h3>📦 Buylora Shop & Share</h3>
    <p>Share product links with friends. These are sample products for the website demo.</p>
  </section>
</main>

<footer>© 2026 Buylora · Demo E-commerce Store</footer>
<div id="toast"></div>

<script>
const productsData = [
 {id:1,name:"Wireless Earbuds",price:499,old:999,cat:"Electronics",emoji:"🎧",desc:"Wireless listening for music, classes and everyday use."},
 {id:2,name:"Fast Charger",price:260,old:399,cat:"Electronics",emoji:"🔌",desc:"A compact charging accessory. Check device compatibility before buying."},
 {id:3,name:"Smart Watch",price:699,old:1299,cat:"Electronics",emoji:"⌚",desc:"A smart watch style accessory for daily use."},
 {id:4,name:"Bluetooth Speaker",price:399,old:799,cat:"Electronics",emoji:"🔊",desc:"Portable speaker for music at home or outdoors."},
 {id:5,name:"Casual T-Shirt",price:299,old:499,cat:"Fashion",emoji:"👕",desc:"Everyday casual wear. Select your size before ordering."},
 {id:6,name:"Travel Backpack",price:599,old:999,cat:"Fashion",emoji:"🎒",desc:"A practical backpack for daily travel and study."},
 {id:7,name:"Desk Lamp",price:349,old:599,cat:"Home",emoji:"💡",desc:"A desk lamp for your reading and study space."},
 {id:8,name:"Water Bottle",price:199,old:299,cat:"Accessories",emoji:"🧴",desc:"A reusable bottle for everyday hydration."}
];

let category="All";
let cart=[];
let currentProduct=null;

function money(n){return "₹"+n.toLocaleString("en-IN")}

function renderProducts(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=productsData.filter(p=>(category==="All"||p.cat===category)&&
 p.name.toLowerCase().includes(q));
 document.getElementById("total").textContent=list.length+" items";
 document.getElementById("products").innerHTML=list.map(p=>`
 <article class="card">
  <div class="product-img">${p.emoji}</div>
  <div class="card-body">
   <span class="tag">${p.cat}</span>
   <h3>${p.name}</h3>
   <div class="price">${money(p.price)}</div>
   <div class="old">${money(p.old)}</div>
   <div class="actions">
    <button class="secondary" onclick="openDetail(${p.id})">View</button>
    <button class="primary" onclick="addCart(${p.id})">Add +</button>
   </div>
   <button class="secondary" style="width:100%;margin-top:7px"
    onclick="shareProduct(${p.id})">↗ Share Product</button>
  </div>
 </article>`).join("")||"<p>No products found.</p>";
}

function setCategory(c,btn){
 category=c;
 document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
 renderProducts();
}

function openDetail(id){
 const p=productsData.find(x=>x.id===id);
 currentProduct=p;
 const d=document.getElementById("detail");
 d.classList.remove("hidden");
 d.innerHTML=`
  <button class="secondary" onclick="closeDetail()">← Back to products</button>
  <div style="font-size:80px;text-align:center;padding:20px">${p.emoji}</div>
  <span class="tag">${p.cat}</span>
  <h2>${p.name}</h2>
  <div class="price">${money(p.price)}</div>
  <div class="old">${money(p.old)}</div>
  <p>${p.desc}</p>
  <p><small>Demo listing: price and availability are not verified.</small></p>
  <button class="primary" onclick="addCart(${p.id})">Add to Cart</button>
  <button class="secondary" onclick="shareProduct(${p.id})">↗ Share Product</button>`;
 d.scrollIntoView({behavior:"smooth"});
}
function closeDetail(){document.getElementById("detail").classList.add("hidden")}

function addCart(id){
 const p=productsData.find(x=>x.id===id);
 const item=cart.find(x=>x.id===id);
 if(item)item.qty++;else cart.push({...p,qty:1});
 updateCart();
 toast(p.name+" added to cart");
}

function updateCart(){
 document.getElementById("count").textContent=cart.reduce((s,p)=>s+p.qty,0);
}
function showCart(){
 const c=document.getElementById("cart");
 c.classList.remove("hidden");
 const total=cart.reduce((s,p)=>s+p.price*p.qty,0);
 c.innerHTML=`<h2>Your Cart</h2>`+
 (cart.length?cart.map(p=>`<p>${p.emoji} ${p.name} × ${p.qty} — ${money(p.price*p.qty)}
 <button class="secondary" onclick="removeCart(${p.id})">Remove</button></p>`).join("")
 :"<p>Your cart is empty.</p>")+
 `<hr><h3>Total: ${money(total)}</h3>
 <p><small>Demo only: checkout and online payments are not connected.</small></p>
 <button class="secondary" onclick="document.getElementById('cart').classList.add('hidden')">Continue Shopping</button>`;
 c.scrollIntoView({behavior:"smooth"});
}
function removeCart(id){cart=cart.filter(p=>p.id!==id);updateCart();showCart()}

async function shareProduct(id){
 const p=productsData.find(x=>x.id===id);
 const url=new URL(location.href);
 url.hash="product-"+p.id;
 const data={title:p.name+" | Buylora",
 text:`Check out ${p.name} on Buylora for ${money(p.price)}. Sample listing.`,
 url:url.href};
 try{
  if(navigator.share) await navigator.share(data);
  else if(navigator.clipboard){
   await navigator.clipboard.writeText(data.text+" "+data.url);
   toast("Product link copied. You can share it now.");
  }else{
   prompt("Copy this product link:",data.url);
  }
 }catch(e){
  if(e.name!=="AbortError")toast("Sharing unavailable. Please try again.");
 }
}

function toast(msg){
 const t=document.getElementById("toast");
 t.textContent=msg;t.style.display="block";
 setTimeout(()=>t.style.display="none",2500);
}
renderProducts();
</script>
</body>
</html>
